# ============================================================
# DATASET PROFILES
# ============================================================

profiles:
  tiny:
    description: "Minimal dataset for debugging - uses synthetic data and tiny samples"
    max_tokens: 100000
    enabled_datasets: []
    use_synthetic: true

  prototype:
    description: "Prototype 1.6B experiment - ~1-2B tokens total"
    max_tokens: 2000000000
    enabled_datasets:
      - fineweb
      - fineweb_edu
      - dclm_baseline
      - wikipedia_en
      - wikipedia_vi
      - arxiv
      - codeparrot
      - starcoderdata
      - math_stackexchange
      - gsm8k
      - cultura_x_vi
      - mc4_vi
    # Override weights for prototype (renormalized)
    weight_overrides:
      fineweb: 0.30
      fineweb_edu: 0.15
      dclm_baseline: 0.10
      wikipedia_en: 0.07
      wikipedia_vi: 0.05
      arxiv: 0.05
      codeparrot: 0.08
      starcoderdata: 0.07
      math_stackexchange: 0.03
      gsm8k: 0.02
      cultura_x_vi: 0.05
      mc4_vi: 0.03

  # Future profiles (not implemented yet)
  # scale_6p4b:
  #   description: "6.4B model - ~10B tokens"
  #   max_tokens: 10000000000
  # scale_25b:
  #   description: "25B model - ~50B tokens"
  #   max_tokens: 50000000000
  # scale_256b:
  #   description: "256B model - ~500B tokens"
  #   max_tokens: 500000000000