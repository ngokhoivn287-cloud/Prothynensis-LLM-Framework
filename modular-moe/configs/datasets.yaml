# Prothynesis Modular MoE - Dataset Registry
# This registry defines all available datasets for the training corpus.
# Each dataset entry includes metadata for downloading, processing, and sampling.
#
# Usage:
#   python scripts/download_datasets.py --config configs/datasets.yaml --profile prototype
#   python scripts/download_datasets.py --config configs/datasets.yaml --profile tiny --only code math

datasets:
  # ============================================================
  # HIGH-QUALITY WEB CORPORA
  # ============================================================
  - name: fineweb
    category: web
    source: huggingface
    hf_id: HuggingFaceFW/fineweb
    subset: sample-10BT
    enabled: true
    weight: 0.30
    language: [en]
    license: ODC-By-1.0
    license_status: VERIFIED
    expected_size_gb: 45
    expected_tokens_billions: 10
    download_method: huggingface_streaming
    preprocessing: fineweb
    notes: "High-quality Common Crawl subset with aggressive filtering. 10B token sample."

  - name: fineweb_edu
    category: web
    source: huggingface
    hf_id: HuggingFaceFW/fineweb-edu
    subset: sample-10BT
    enabled: true
    weight: 0.15
    language: [en]
    license: ODC-By-1.0
    license_status: VERIFIED
    expected_size_gb: 15
    expected_tokens_billions: 3
    download_method: huggingface_streaming
    preprocessing: fineweb
    notes: "Educational subset of FineWeb, higher quality for reasoning tasks."

  - name: redpajama_v2
    category: web
    source: huggingface
    hf_id: togethercomputer/RedPajama-Data-V2
    subset: default
    enabled: true
    weight: 0.10
    language: [en]
    license: Apache-2.0
    license_status: VERIFIED
    expected_size_gb: 30
    expected_tokens_billions: 8
    download_method: huggingface_streaming
    preprocessing: redpajama
    notes: "Reproduction of LLaMA training dataset. Multiple quality signals."

  - name: dclm_baseline
    category: web
    source: huggingface
    hf_id: mlfoundations/dclm-baseline-1.0
    subset: default
    enabled: true
    weight: 0.10
    language: [en]
    license: ODC-By-1.0
    license_status: VERIFIED
    expected_size_gb: 20
    expected_tokens_billions: 5
    download_method: huggingface_streaming
    preprocessing: fineweb
    notes: "DCLM baseline - high-quality filtered Common Crawl."

  # ============================================================
  # WIKIPEDIA / ENCYCLOPEDIC
  # ============================================================
  - name: wikipedia_en
    category: encyclopedia
    source: huggingface
    hf_id: wikimedia/wikipedia
    subset: "20231101.en"
    enabled: true
    weight: 0.08
    language: [en]
    license: CC-BY-SA-3.0
    license_status: VERIFIED
    expected_size_gb: 5
    expected_tokens_billions: 1.5
    download_method: huggingface_streaming
    preprocessing: wikipedia
    notes: "English Wikipedia dump (wikimedia/wikipedia). High-quality encyclopedic knowledge."

  - name: wikipedia_vi
    category: encyclopedia
    source: huggingface
    hf_id: wikimedia/wikipedia
    subset: "20231101.vi"
    enabled: true
    weight: 0.04
    language: [vi]
    license: CC-BY-SA-3.0
    license_status: VERIFIED
    expected_size_gb: 0.5
    expected_tokens_billions: 0.15
    download_method: huggingface_streaming
    preprocessing: wikipedia
    notes: "Vietnamese Wikipedia dump (wikimedia/wikipedia). Critical for Vietnamese language support."

  - name: wikipedia_multilingual
    category: encyclopedia
    source: huggingface
    hf_id: wikimedia/wikipedia
    subset: "20231101.zh,20231101.ja,20231101.ko,20231101.fr,20231101.de,20231101.es,20231101.pt,20231101.ru,20231101.ar,20231101.hi"
    enabled: true
    weight: 0.05
    language: [zh, ja, ko, fr, de, es, pt, ru, ar, hi]
    license: CC-BY-SA-3.0
    license_status: VERIFIED
    expected_size_gb: 8
    expected_tokens_billions: 2.5
    download_method: huggingface_streaming
    preprocessing: wikipedia
    notes: "Top 10 non-English Wikipedia languages (wikimedia/wikipedia) for multilingual support."

