[project]
name = "modular-moe"
version = "0.1.0"
description = "Modular/Recursive Mixture-of-Experts Pretraining Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "datasets>=2.19.0",
    "transformers>=4.39.0",
    "tokenizers>=0.19.0",
    "accelerate>=0.28.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "safetensors>=0.4.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "huggingface-hub>=0.22.0",
    "scipy>=1.11.0",
    "wandb>=0.16.0",
    "datasketch>=1.6.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false