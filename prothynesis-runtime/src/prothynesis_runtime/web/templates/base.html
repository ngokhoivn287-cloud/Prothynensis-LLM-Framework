<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prothynesis Runtime</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --surface-2: #23262e;
      --border: #2e323a;
      --text: #e6e8ee;
      --muted: #9aa0ac;
      --accent: #6ea8fe;
      --danger: #f87171;
      --success: #4ade80;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      overflow-y: auto;
    }
    .sidebar a {
      display: block;
      color: var(--muted);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--surface-2);
      color: var(--text);
    }
    .brand {
      font-weight: 700;
      padding: 8px 12px 18px;
      color: var(--accent);
    }
    .content {
      margin-left: 220px;
      padding: 24px;
      width: 100%;
      max-width: 1000px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 240px; }
    button {
      background: var(--accent);
      color: #0b0d12;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: var(--surface-2); color: var(--text); }
    button.danger { background: var(--danger); color: #0b0d12; }
    input, select, textarea {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      width: 100%;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      font-size: 12px;
      color: var(--muted);
    }
    .status-badge.running { background: rgba(74, 222, 128, 0.15); color: var(--success); }
    .status-badge.paused { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
    .progress-bar {
      height: 8px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }
    @media (max-width: 720px) {
      .sidebar { width: 100%; position: relative; }
      .content { margin-left: 0; }
    }
  </style>
  {% block content %}{% endblock %}
</body>
</html>
